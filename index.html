<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Derecho Societario Jornadas 2026</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
            type="module"></script>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #eeeeee;
        }

        body {
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            padding: 15px;
        }

        h1 {
            text-align: center;
            margin: 5px 0 15px;
            font-size: 24px;
        }

        #toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 8px 13px;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #111;
        }

        #zoom-label {
            min-width: 60px;
            text-align: center;
            font-weight: bold;
        }

        #page-slider {
            width: 180px;
        }

        #page-info {
            min-width: 75px;
            text-align: center;
        }

        #book-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            min-height: 60vh;
            max-height: 78vh;
            border-radius: 8px;
            touch-action: none;
            position: relative;
        }

        /*
         * IMPORTANTE:
         * #book NO recibe transformaciones.
         * StPageFlip controla directamente su geometría.
         */
        #book {
            position: relative;
            width: 100%;
            height: 72vh;
            min-height: 500px;
            max-height: 900px;
            margin: 0 auto;
        }

        .page {
            background: white;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /*
         * Este viewport pertenece a la página,
         * pero no modifica la geometría de StPageFlip.
         */
        .page-viewport {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: white;
        }

        /*
         * Este es el elemento que realmente recibe
         * el zoom y el desplazamiento.
         */
        .page-content {
            position: absolute;
            inset: 0;
            transform-origin: center center;
            will-change: transform;
        }

        .page canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: white;
            display: block;
        }

        /*
         * Capa transparente para los enlaces internos
         * del índice del PDF.
         */
        .pdf-link-layer {
            position: absolute;
            inset: 0;
            pointer-events: auto;
        }

        .pdf-link {
            position: absolute;
            display: block;
            cursor: pointer;
            background: transparent;
        }

        .pdf-link:hover {
            background: rgba(30, 100, 200, 0.08);
        }

        #loading {
            text-align: center;
            padding: 30px;
            font-size: 18px;
        }

        #download {
            display: inline-block;
            text-decoration: none;
            border-radius: 6px;
            padding: 8px 13px;
            background: #333;
            color: white;
            font-size: 14px;
        }

        #download:hover {
            background: #111;
        }

        /*
         * Cuando estamos haciendo zoom, el cursor ayuda a
         * indicar que se puede arrastrar.
         */
        #book-wrapper.zoomed {
            cursor: grab;
        }

        #book-wrapper.zoomed.dragging {
            cursor: grabbing;
        }

        @media (max-width: 700px) {
            #app {
                padding: 8px;
            }

            h1 {
                font-size: 20px;
            }

            #book {
                height: 68vh;
                min-height: 400px;
            }

            #page-slider {
                width: 140px;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <h1>Derecho Societario Jornadas 2026</h1>

    <div id="toolbar">

        <button id="prev-btn">← Anterior</button>

        <button id="next-btn">Siguiente →</button>

        <button id="zoom-out">−</button>

        <span id="zoom-label">100%</span>

        <button id="zoom-in">+</button>

        <button id="zoom-reset">100%</button>

        <span id="page-info">1 / 150</span>

        <input
            id="page-slider"
            type="range"
            min="1"
            max="150"
            value="1"
        >

        <button id="fullscreen-btn">⛶ Pantalla completa</button>

        <a
            id="download"
            href="Derecho_Societario_Jornadas_2026.pdf"
            download
        >
            Descargar PDF
        </a>

    </div>

    <div id="loading">
        Cargando revista…
    </div>

    <div id="book-wrapper">

        <!--
            NO transformar este elemento.
            StPageFlip controla su tamaño y posición.
        -->
        <div id="book"></div>

    </div>

</div>


<script type="module">

    const pdfjsLib = await import(
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    );

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


    const PDF_URL = "Derecho_Societario_Jornadas_2026.pdf";


    const bookWrapper = document.getElementById("book-wrapper");
    const bookElement = document.getElementById("book");
    const loadingElement = document.getElementById("loading");

    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    const zoomInBtn = document.getElementById("zoom-in");
    const zoomOutBtn = document.getElementById("zoom-out");
    const zoomResetBtn = document.getElementById("zoom-reset");

    const zoomLabel = document.getElementById("zoom-label");

    const pageInfo = document.getElementById("page-info");
    const pageSlider = document.getElementById("page-slider");

    const fullscreenBtn =
        document.getElementById("fullscreen-btn");


    let pdfDocument = null;
    let pageFlip = null;

    const totalPages = 150;


    /*
     * ==========================================================
     * ZOOM
     * ==========================================================
     *
     * El zoom NO toca #book.
     *
     * Solamente transforma .page-content.
     */

    let zoom = 1;

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 3;

    const ZOOM_BUTTON_STEP = 0.10;
    const ZOOM_WHEEL_STEP = 0.08;


    let panX = 0;
    let panY = 0;

    let isDragging = false;

    let dragStartX = 0;
    let dragStartY = 0;

    let dragOriginX = 0;
    let dragOriginY = 0;


    function getPageContents() {
        return document.querySelectorAll(".page-content");
    }


    /*
     * Calcula cuánto puede desplazarse el contenido
     * sin dejar espacios blancos innecesarios.
     */
    function getPanLimits() {

        const rect = bookWrapper.getBoundingClientRect();

        const viewportWidth = rect.width;
        const viewportHeight = rect.height;

        const bookRect = bookElement.getBoundingClientRect();

        /*
         * bookRect está en coordenadas visuales y no tiene
         * transformación propia. Por lo tanto estas dimensiones
         * son estables.
         */
        const baseWidth = bookRect.width;
        const baseHeight = bookRect.height;

        const scaledWidth = baseWidth * zoom;
        const scaledHeight = baseHeight * zoom;

        const maxX = Math.max(
            0,
            (scaledWidth - viewportWidth) / 2
        );

        const maxY = Math.max(
            0,
            (scaledHeight - viewportHeight) / 2
        );

        return {
            x: maxX,
            y: maxY
        };
    }


    function clampPan() {

        if (zoom <= 1.001) {
            panX = 0;
            panY = 0;
            return;
        }

        const limits = getPanLimits();

        panX = Math.max(
            -limits.x,
            Math.min(limits.x, panX)
        );

        panY = Math.max(
            -limits.y,
            Math.min(limits.y, panY)
        );
    }


    function applyZoom() {

        clampPan();

        const transform =
            `translate(${panX}px, ${panY}px) scale(${zoom})`;

        getPageContents().forEach(content => {
            content.style.transform = transform;
        });

        zoomLabel.textContent =
            Math.round(zoom * 100) + "%";


        if (zoom > 1.001) {
            bookWrapper.classList.add("zoomed");
        } else {
            bookWrapper.classList.remove("zoomed");
            bookWrapper.classList.remove("dragging");
        }
    }


    function setZoom(newZoom) {

        const oldZoom = zoom;

        zoom = Math.max(
            MIN_ZOOM,
            Math.min(MAX_ZOOM, newZoom)
        );

        /*
         * Al volver a 100%, todo queda centrado.
         */
        if (zoom <= 1.001) {
            panX = 0;
            panY = 0;
        } else if (oldZoom <= 1.001) {
            /*
             * Cuando recién entramos al zoom,
             * empezamos siempre centrados.
             */
            panX = 0;
            panY = 0;
        }

        applyZoom();
    }


    zoomInBtn.addEventListener("click", () => {
        setZoom(zoom + ZOOM_BUTTON_STEP);
    });


    zoomOutBtn.addEventListener("click", () => {
        setZoom(zoom - ZOOM_BUTTON_STEP);
    });


    zoomResetBtn.addEventListener("click", () => {
        setZoom(1);
    });


    /*
     * ==========================================================
     * ARRASTRE
     * ==========================================================
     */

    bookWrapper.addEventListener("pointerdown", event => {

        if (zoom <= 1.001) {
            return;
        }

        /*
         * Si hacemos click sobre un enlace, dejamos que
         * el enlace funcione.
         */
        if (event.target.closest(".pdf-link")) {
            return;
        }

        isDragging = true;

        dragStartX = event.clientX;
        dragStartY = event.clientY;

        dragOriginX = panX;
        dragOriginY = panY;

        bookWrapper.classList.add("dragging");

        try {
            bookWrapper.setPointerCapture(event.pointerId);
        } catch (e) {
        }
    });


    bookWrapper.addEventListener("pointermove", event => {

        if (!isDragging) {
            return;
        }

        const dx = event.clientX - dragStartX;
        const dy = event.clientY - dragStartY;

        panX = dragOriginX + dx;
        panY = dragOriginY + dy;

        applyZoom();
    });


    function stopDragging(event) {

        if (!isDragging) {
            return;
        }

        isDragging = false;

        bookWrapper.classList.remove("dragging");

        try {
            bookWrapper.releasePointerCapture(event.pointerId);
        } catch (e) {
        }
    }


    bookWrapper.addEventListener(
        "pointerup",
        stopDragging
    );

    bookWrapper.addEventListener(
        "pointercancel",
        stopDragging
    );


    /*
     * ==========================================================
     * RUEDA
     * ==========================================================
     *
     * Sin zoom:
     *     rueda = zoom
     *
     * Con zoom:
     *     rueda = desplazamiento vertical
     *
     * Shift + rueda:
     *     desplazamiento horizontal
     *
     * Ctrl + rueda:
     *     zoom
     */

    bookWrapper.addEventListener("wheel", event => {

        event.preventDefault();


        /*
         * CTRL + rueda = zoom siempre.
         */
        if (event.ctrlKey) {

            if (event.deltaY < 0) {
                setZoom(zoom + ZOOM_WHEEL_STEP);
            } else {
                setZoom(zoom - ZOOM_WHEEL_STEP);
            }

            return;
        }


        /*
         * Con zoom activo, la rueda desplaza.
         */
        if (zoom > 1.001) {

            if (event.shiftKey) {

                panX -= event.deltaY;

            } else {

                panY -= event.deltaY;
                panX -= event.deltaX;

            }

            applyZoom();

            return;
        }


        /*
         * Sin zoom, la rueda sigue funcionando
         * como control de zoom.
         */
        if (event.deltaY < 0) {

            setZoom(zoom + ZOOM_WHEEL_STEP);

        } else {

            setZoom(zoom - ZOOM_WHEEL_STEP);

        }

    }, {
        passive: false
    });


    /*
     * ==========================================================
     * CREACIÓN DE PÁGINAS
     * ==========================================================
     */

    async function createPage(pageNumber) {

        const page = document.createElement("div");

        page.className = "page";

        /*
         * NO ponemos data-density="hard".
         *
         * showCover:true de StPageFlip se ocupa de
         * la portada y contraportada.
         */
        if (pageNumber === 1) {
            page.classList.add("cover");
        }


        /*
         * Viewport fijo.
         */
        const viewport = document.createElement("div");

        viewport.className = "page-viewport";


        /*
         * Contenido que recibe exclusivamente
         * el zoom/pan.
         */
        const content = document.createElement("div");

        content.className = "page-content";


        const canvas = document.createElement("canvas");

        const context = canvas.getContext("2d");


        const pdfPage =
            await pdfDocument.getPage(pageNumber);


        const viewportPDF =
            pdfPage.getViewport({
                scale: 1.25
            });


        canvas.width =
            Math.ceil(viewportPDF.width);

        canvas.height =
            Math.ceil(viewportPDF.height);


        canvas.style.width = "100%";
        canvas.style.height = "100%";


        await pdfPage.render({
            canvasContext: context,
            viewport: viewportPDF
        }).promise;


        content.appendChild(canvas);


        /*
         * ======================================================
         * ENLACES INTERNOS DEL PDF
         * ======================================================
         */

        const linkLayer =
            document.createElement("div");

        linkLayer.className = "pdf-link-layer";


        try {

            const annotations =
                await pdfPage.getAnnotations({
                    intent: "display"
                });


            for (const annotation of annotations) {

                if (
                    annotation.subtype !== "Link" ||
                    !annotation.rect
                ) {
                    continue;
                }


                const link =
                    document.createElement("a");

                link.className = "pdf-link";

                link.href = "#";


                const rect =
                    viewportPDF.convertToViewportRectangle(
                        annotation.rect
                    );


                const left =
                    Math.min(rect[0], rect[2]);

                const top =
                    Math.min(rect[1], rect[3]);

                const width =
                    Math.abs(rect[2] - rect[0]);

                const height =
                    Math.abs(rect[3] - rect[1]);


                link.style.left =
                    (left / viewportPDF.width * 100) + "%";

                link.style.top =
                    (top / viewportPDF.height * 100) + "%";

                link.style.width =
                    (width / viewportPDF.width * 100) + "%";

                link.style.height =
                    (height / viewportPDF.height * 100) + "%";


                /*
                 * Destino interno.
                 */
                if (annotation.dest) {

                    link.addEventListener(
                        "click",
                        async event => {

                            event.preventDefault();
                            event.stopPropagation();


                            try {

                                const destination =
                                    await pdfDocument.getDestination(
                                        annotation.dest
                                    );


                                if (!destination) {
                                    return;
                                }


                                const ref =
                                    destination[0];


                                const targetPage =
                                    await pdfDocument.getPageIndex(
                                        ref
                                    );


                                const target =
                                    targetPage;


                                if (
                                    pageFlip &&
                                    target >= 0 &&
                                    target < totalPages
                                ) {

                                    pageFlip.flip(
                                        target,
                                        "top"
                                    );

                                    pageSlider.value =
                                        target + 1;

                                    pageInfo.textContent =
                                        `${target + 1} / ${totalPages}`;
                                }

                            } catch (error) {

                                console.error(
                                    "Error al abrir enlace interno:",
                                    error
                                );

                            }

                        }
                    );

                } else if (annotation.url) {

                    link.href = annotation.url;

                    link.target = "_blank";

                } else {

                    continue;
                }


                linkLayer.appendChild(link);
            }

        } catch (error) {

            console.warn(
                "No se pudieron cargar las anotaciones:",
                error
            );

        }


        content.appendChild(linkLayer);

        viewport.appendChild(content);

        page.appendChild(viewport);


        return page;
    }


    /*
     * ==========================================================
     * STPAGEFLIP
     * ==========================================================
     *
     * Esta parte vuelve a la configuración que funcionaba.
     *
     * El libro NO recibe transform.
     */

    async function createFlipbook() {

        const pages = [];

        for (
            let pageNumber = 1;
            pageNumber <= totalPages;
            pageNumber++
        ) {

            const page =
                await createPage(pageNumber);

            pages.push(page);

            bookElement.appendChild(page);

            loadingElement.textContent =
                `Cargando página ${pageNumber} de ${totalPages}…`;
        }


        pageFlip =
            new St.PageFlip(
                bookElement,
                {
                    width: 500,
                    height: 707,

                    size: "stretch",

                    minWidth: 280,
                    maxWidth: 650,

                    minHeight: 396,
                    maxHeight: 920,

                    autoSize: true,

                    showCover: true,

                    usePortrait: true,

                    mobileScrollSupport: true,

                    useMouseEvents: true,

                    swipeDistance: 30,

                    flippingTime: 850,

                    drawShadow: true,

                    maxShadowOpacity: 0.55,

                    startPage: 0,

                    startZIndex: 0,

                    disableFlipByClick: false
                }
            );


        pageFlip.loadFromHTML(pages);


        pageFlip.on(
            "flip",
            event => {

                const pageIndex =
                    event.data;

                pageInfo.textContent =
                    `${pageIndex + 1} / ${totalPages}`;

                pageSlider.value =
                    pageIndex + 1;

                /*
                 * El zoom permanece.
                 *
                 * Como solo transformamos .page-content,
                 * el nuevo contenido recibe el zoom sin
                 * alterar la geometría de la hoja.
                 */
                applyZoom();
            }
        );


        pageFlip.on(
            "changeState",
            () => {
                applyZoom();
            }
        );


        loadingElement.style.display = "none";

        applyZoom();
    }


    /*
     * ==========================================================
     * BOTONES DE NAVEGACIÓN
     * ==========================================================
     */

    prevBtn.addEventListener(
        "click",
        () => {

            if (!pageFlip) {
                return;
            }

            pageFlip.flipPrev("top");
        }
    );


    nextBtn.addEventListener(
        "click",
        () => {

            if (!pageFlip) {
                return;
            }

            pageFlip.flipNext("top");
        }
    );


    /*
     * ==========================================================
     * SLIDER
     * ==========================================================
     */

    pageSlider.addEventListener(
        "input",
        () => {

            if (!pageFlip) {
                return;
            }

            const target =
                Number(pageSlider.value) - 1;

            pageFlip.flip(
                target,
                "top"
            );
        }
    );


    /*
     * ==========================================================
     * TECLADO
     * ==========================================================
     */

    document.addEventListener(
        "keydown",
        event => {

            /*
             * No interceptar teclas mientras se escribe
             * en un input.
             */
            if (
                event.target.tagName === "INPUT" ||
                event.target.tagName === "TEXTAREA"
            ) {
                return;
            }


            if (event.key === "ArrowLeft") {

                event.preventDefault();

                if (pageFlip) {
                    pageFlip.flipPrev("top");
                }

            }


            if (event.key === "ArrowRight") {

                event.preventDefault();

                if (pageFlip) {
                    pageFlip.flipNext("top");
                }

            }


            if (event.key === "+" || event.key === "=") {

                event.preventDefault();

                setZoom(
                    zoom + ZOOM_BUTTON_STEP
                );

            }


            if (event.key === "-") {

                event.preventDefault();

                setZoom(
                    zoom - ZOOM_BUTTON_STEP
                );

            }


            if (event.key === "0") {

                event.preventDefault();

                setZoom(1);

            }

        }
    );


    /*
     * ==========================================================
     * PANTALLA COMPLETA
     * ==========================================================
     */

    fullscreenBtn.addEventListener(
        "click",
        async () => {

            try {

                if (!document.fullscreenElement) {

                    await document.documentElement.requestFullscreen();

                } else {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.error(
                    "Fullscreen:",
                    error
                );

            }
        }
    );


    document.addEventListener(
        "fullscreenchange",
        () => {

            /*
             * Esperamos un momento para que el navegador
             * termine de cambiar las dimensiones.
             */
            setTimeout(
                () => {

                    if (pageFlip) {
                        pageFlip.update();
                    }

                    applyZoom();

                },
                100
            );

        }
    );


    /*
     * ==========================================================
     * RESIZE
     * ==========================================================
     */

    window.addEventListener(
        "resize",
        () => {

            if (pageFlip) {
                pageFlip.update();
            }

            setTimeout(
                () => {
                    applyZoom();
                },
                50
            );

        }
    );


    /*
     * ==========================================================
     * CARGAR PDF
     * ==========================================================
     */

    try {

        pdfDocument =
            await pdfjsLib.getDocument(
                PDF_URL
            ).promise;


        if (pdfDocument.numPages !== totalPages) {

            console.warn(
                `El PDF tiene ${pdfDocument.numPages} páginas; ` +
                `se esperaba ${totalPages}.`
            );
        }


        pageSlider.max =
            pdfDocument.numPages;


        pageInfo.textContent =
            `1 / ${pdfDocument.numPages}`;


        await createFlipbook();

    } catch (error) {

        console.error(error);

        loadingElement.textContent =
            "Error al cargar el PDF.";

    }

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Derecho Societario Jornadas 2026</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #181818;
      color: white;
    }

    header {
      height: 58px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-bottom: 1px solid #333;
    }

    .titulo {
      font-size: 18px;
      font-weight: bold;
    }

    .controles {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button,
    .descargar {
      border: 1px solid #555;
      background: #292929;
      color: white;
      padding: 8px 11px;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    button:hover,
    .descargar:hover {
      background: #444;
    }

    #pagina {
      min-width: 105px;
      text-align: center;
      font-size: 14px;
    }

    #visor {
      height: calc(100vh - 98px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
      background:
        radial-gradient(
          circle at center,
          #414141 0%,
          #252525 55%,
          #111 100%
        );
    }

    #libro {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1800px;
    }

    .hoja {
      background: white;
      box-shadow:
        0 12px 35px rgba(0,0,0,.55);
      position: relative;
      overflow: hidden;
      transform-origin: left center;
      backface-visibility: hidden;
    }

    .hoja canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hoja.voltear {
      animation: pasarPagina .65s ease-in-out;
    }

    @keyframes pasarPagina {

      0% {
        transform: rotateY(0deg);
      }

      45% {
        transform: rotateY(-88deg);
      }

      100% {
        transform: rotateY(0deg);
      }

    }

    .sombra {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 8px;
      transform: translateX(-50%);
      background:
        linear-gradient(
          to right,
          transparent,
          rgba(0,0,0,.22),
          transparent
        );
      pointer-events: none;
      z-index: 10;
    }

    footer {
      height: 40px;
      background: #111;
      display: flex;
      align-items: center;
      padding: 5px 16px;
      gap: 10px;
      border-top: 1px solid #333;
    }

    #barra {
      flex: 1;
    }

    #estado {
      font-size: 12px;
      opacity: .7;
    }

    @media (max-width: 700px) {

      .titulo {
        display: none;
      }

      header {
        justify-content: center;
      }

      .controles {
        gap: 3px;
      }

      #pagina {
        min-width: 75px;
      }

      .descargar {
        font-size: 0;
      }

      .descargar::after {
        content: "⬇";
        font-size: 16px;
      }

      #visor {
        padding: 8px;
      }

    }

  </style>
</head>

<body>

<header>

  <div class="titulo">
    Derecho Societario Jornadas 2026
  </div>

  <div class="controles">

    <button id="anterior">‹</button>

    <span id="pagina">
      Cargando...
    </span>

    <button id="siguiente">›</button>

    <button id="menos">−</button>

    <button id="mas">+</button>

    <button id="pantalla">⛶</button>

    <a
      class="descargar"
      href="Derecho_Societario_Jornadas_2026.pdf"
      download
    >
      ⬇ Descargar PDF
    </a>

  </div>

</header>


<main id="visor">

  <div id="libro">

    <div id="hojaIzquierda" class="hoja">
      <canvas id="canvasIzquierda"></canvas>
    </div>

    <div id="hojaDerecha" class="hoja">
      <canvas id="canvasDerecha"></canvas>
    </div>

    <div class="sombra"></div>

  </div>

</main>


<footer>

  <input
    id="barra"
    type="range"
    min="1"
    max="150"
    value="1"
  >

  <span id="estado">
    Preparando revista...
  </span>

</footer>


<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


/*
  ARCHIVO PDF
*/

const PDF =
"Derecho_Societario_Jornadas_2026.pdf";


let documento = null;

let paginaActual = 1;

let zoom = 1;


const hojaIzquierda =
document.getElementById("hojaIzquierda");

const hojaDerecha =
document.getElementById("hojaDerecha");

const canvasIzquierda =
document.getElementById("canvasIzquierda");

const canvasDerecha =
document.getElementById("canvasDerecha");

const pagina =
document.getElementById("pagina");

const barra =
document.getElementById("barra");

const estado =
document.getElementById("estado");

const visor =
document.getElementById("visor");


async function iniciar() {

  try {

    documento =
      await pdfjsLib
        .getDocument(PDF)
        .promise;

    barra.max =
      documento.numPages;

    estado.textContent =
      documento.numPages +
      " páginas";

    await mostrarPortada();

  }

  catch(error) {

    console.error(error);

    estado.textContent =
      "Error al cargar la revista";

    pagina.textContent =
      "Error";

  }

}


async function dibujarPagina(
  numero,
  canvas
) {

  if (
    numero < 1 ||
    numero > documento.numPages
  ) {

    canvas.style.display = "none";

    return;

  }


  canvas.style.display = "block";


  const page =
    await documento.getPage(numero);


  const original =
    page.getViewport({
      scale: 1
    });


  const anchoMax =
    Math.min(
      visor.clientWidth - 40,
      1400
    );


  const altoMax =
    visor.clientHeight - 40;


  /*
    En PC mostramos dos páginas.
    En celular mostramos una.
  */

  const movil =
    window.innerWidth < 700;


  const anchoPagina =
    movil
      ? anchoMax
      : anchoMax / 2;


  const escala =
    Math.min(
      anchoPagina / original.width,
      altoMax / original.height
    ) * zoom;


  const viewport =
    page.getViewport({
      scale: escala
    });


  canvas.width =
    viewport.width;

  canvas.height =
    viewport.height;


  await page.render({

    canvasContext:
      canvas.getContext("2d"),

    viewport:
      viewport

  }).promise;

}


async function ajustarTamano() {

  const movil =
    window.innerWidth < 700;


  const primeraPagina =
    await documento.getPage(1);


  const original =
    primeraPagina.getViewport({
      scale: 1
    });


  const anchoMax =
    Math.min(
      visor.clientWidth - 40,
      1400
    );


  const altoMax =
    visor.clientHeight - 40;


  const anchoPagina =
    movil
      ? anchoMax
      : anchoMax / 2;


  const escala =
    Math.min(
      anchoPagina / original.width,
      altoMax / original.height
    ) * zoom;


  const ancho =
    original.width * escala;


  const alto =
    original.height * escala;


  hojaIzquierda.style.width =
    ancho + "px";

  hojaIzquierda.style.height =
    alto + "px";


  hojaDerecha.style.width =
    ancho + "px";

  hojaDerecha.style.height =
    alto + "px";


  if (movil) {

    hojaDerecha.style.display =
      "none";

  }

  else {

    hojaDerecha.style.display =
      "block";

  }

}


async function mostrarPortada() {

  paginaActual = 1;

  await ajustarTamano();

  await dibujarPagina(
    1,
    canvasIzquierda
  );


  if (window.innerWidth < 700) {

    pagina.textContent =
      "1 / " +
      documento.numPages;

  }

  else {

    await dibujarPagina(
      2,
      canvasDerecha
    );

    pagina.textContent =
      "1–2 / " +
      documento.numPages;

  }

  barra.value = 1;

}


async function mostrarPaginas(
  numero,
  animacion = true
) {

  numero =
    Math.max(
      1,
      Math.min(
        numero,
        documento.numPages
      )
    );


  if (
    animacion &&
    numero !== paginaActual
  ) {

    const hoja =
      numero > paginaActual
        ? hojaDerecha
        : hojaIzquierda;


    hoja.classList.remove(
      "voltear"
    );


    void hoja.offsetWidth;


    hoja.classList.add(
      "voltear"
    );

  }


  paginaActual = numero;


  await ajustarTamano();


  const movil =
    window.innerWidth < 700;


  if (movil) {

    await dibujarPagina(
      paginaActual,
      canvasIzquierda
    );

    pagina.textContent =
      paginaActual +
      " / " +
      documento.numPages;

  }

  else {

    await dibujarPagina(
      paginaActual,
      canvasIzquierda
    );


    await dibujarPagina(
      paginaActual + 1,
      canvasDerecha
    );


    if (
      paginaActual + 1
      <= documento.numPages
    ) {

      pagina.textContent =
        paginaActual +
        "–" +
        (paginaActual + 1) +
        " / " +
        documento.numPages;

    }

    else {

      pagina.textContent =
        paginaActual +
        " / " +
        documento.numPages;

    }

  }


  barra.value =
    paginaActual;

}


document
.getElementById("siguiente")
.addEventListener(
  "click",
  () => {

    if (
      paginaActual <
      documento.numPages
    ) {

      mostrarPaginas(
        window.innerWidth < 700
          ? paginaActual + 1
          : paginaActual + 2
      );

    }

  }
);


document
.getElementById("anterior")
.addEventListener(
  "click",
  () => {

    if (paginaActual > 1) {

      mostrarPaginas(
        window.innerWidth < 700
          ? paginaActual - 1
          : Math.max(
              1,
              paginaActual - 2
            )
      );

    }

  }
);


document
.getElementById("mas")
.addEventListener(
  "click",
  async () => {

    zoom =
      Math.min(
        zoom + .15,
        2
      );

    await mostrarPaginas(
      paginaActual,
      false
    );

  }
);


document
.getElementById("menos")
.addEventListener(
  "click",
  async () => {

    zoom =
      Math.max(
        zoom - .15,
        .65
      );

    await mostrarPaginas(
      paginaActual,
      false
    );

  }
);


document
.getElementById("pantalla")
.addEventListener(
  "click",
  () => {

    if (
      !document.fullscreenElement
    ) {

      document.documentElement
        .requestFullscreen();

    }

    else {

      document.exitFullscreen();

    }

  }
);


barra.addEventListener(
  "input",
  () => {

    mostrarPaginas(
      Number(barra.value),
      false
    );

  }
);


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "ArrowRight"
    ) {

      mostrarPaginas(
        window.innerWidth < 700
          ? paginaActual + 1
          : paginaActual + 2
      );

    }


    if (
      event.key === "ArrowLeft"
    ) {

      mostrarPaginas(
        window.innerWidth < 700
          ? paginaActual - 1
          : Math.max(
              1,
              paginaActual - 2
            )
      );

    }

  }
);


window.addEventListener(
  "resize",
  () => {

    mostrarPaginas(
      paginaActual,
      false
    );

  }
);


iniciar();

</script>

</body>
</html>

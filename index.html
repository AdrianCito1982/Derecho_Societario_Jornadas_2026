<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Derecho Societario Jornadas 2026</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
        type="module"></script>

<!-- StPageFlip -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at center top, #343434 0%, #171717 45%, #090909 100%);
    color: white;
    overflow-x: hidden;
}

/* =========================================================
   CABECERA
   ========================================================= */

.header {
    width: 100%;
    padding: 18px 20px 12px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.3px;
}

.header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: #cfcfcf;
}

/* =========================================================
   CONTENEDOR PRINCIPAL
   ========================================================= */

.main {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 15px 20px;
}

.viewer {
    width: min(96vw, 1500px);
    position: relative;
}

/* =========================================================
   ÁREA DEL FLIPBOOK
   ========================================================= */

#book-wrapper {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    min-height: 60vh;
    max-height: 78vh;

    border-radius: 8px;

    /*
       El desplazamiento cuando hay zoom
       se maneja mediante translate().
    */
    touch-action: none;

    position: relative;
}

/* =========================================================
   CAPA DE DESPLAZAMIENTO
   ========================================================= */

#zoom-stage {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    transform-origin: center center;

    will-change: transform;

    /*
       Muy importante:

       StPageFlip sigue trabajando sobre #book.
       El zoom/desplazamiento se aplica solamente
       a esta capa externa.
    */
}

/* =========================================================
   LIBRO
   ========================================================= */

#book {
    position: relative;

    width: 100%;
    height: 72vh;

    min-height: 500px;
    max-height: 900px;

    margin: 0 auto;
}

/* =========================================================
   PÁGINAS
   ========================================================= */

.page {
    background: white;

    overflow: hidden;

    box-shadow:
        0 0 12px rgba(0,0,0,0.30);

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
}

.page canvas {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: white;
}

/* Portada */

.page.cover {
    background: white;
}

/* =========================================================
   ENLACES DEL PDF
   ========================================================= */

.link-layer {
    position: absolute;

    inset: 0;

    z-index: 20;

    pointer-events: none;
}

.pdf-link {
    position: absolute;

    display: block;

    background: transparent;

    pointer-events: auto;

    cursor: pointer;
}

/* =========================================================
   CARGANDO
   ========================================================= */

.loading {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    z-index: 100;

    background: rgba(0,0,0,0.78);

    padding: 25px 35px;

    border-radius: 10px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.loading.hidden {
    display: none;
}

.spinner {
    width: 42px;
    height: 42px;

    margin: 0 auto 15px;

    border: 4px solid rgba(255,255,255,0.25);
    border-top-color: white;

    border-radius: 50%;

    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   CONTROLES
   ========================================================= */

.controls {
    width: 100%;

    display: flex;
    flex-wrap: wrap;

    justify-content: center;
    align-items: center;

    gap: 8px;

    margin-top: 15px;
}

button,
.download {
    border: none;

    background: #252525;
    color: white;

    padding: 9px 14px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 14px;

    transition:
        background 0.15s ease,
        transform 0.15s ease;
}

button:hover,
.download:hover {
    background: #3c3c3c;
}

button:active,
.download:active {
    transform: scale(0.97);
}

button:disabled {
    opacity: 0.45;
    cursor: default;
}

.download {
    text-decoration: none;
}

/* =========================================================
   SLIDER
   ========================================================= */

.slider-container {
    width: min(700px, 90vw);

    display: flex;
    align-items: center;

    gap: 10px;

    margin: 14px auto 0;
}

#pageSlider {
    flex: 1;
    cursor: pointer;
}

#pageInfo {
    min-width: 105px;

    text-align: center;

    font-size: 13px;

    color: #ddd;
}

/* =========================================================
   AYUDA
   ========================================================= */

.help {
    text-align: center;

    color: #aaa;

    font-size: 12px;

    margin-top: 10px;
}

/* =========================================================
   PANTALLA COMPLETA
   ========================================================= */

.fullscreen .header {
    display: none;
}

.fullscreen .main {
    padding: 0;
}

.fullscreen .viewer {
    width: 100vw;
}

.fullscreen #book-wrapper {
    height: 100vh;
    max-height: none;

    border-radius: 0;
}

.fullscreen #book {
    height: 92vh;
}

/* =========================================================
   ERROR
   ========================================================= */

.error {
    max-width: 650px;

    margin: 40px auto;

    padding: 25px;

    background: #421c1c;

    border: 1px solid #813838;

    border-radius: 8px;

    line-height: 1.5;

    text-align: center;
}

.error code {
    color: #ffd6d6;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 800px) {

    .header h1 {
        font-size: 19px;
    }

    .header p {
        font-size: 12px;
    }

    #book {
        height: 70vh;
        min-height: 420px;
    }

    .controls {
        gap: 6px;
    }

    button,
    .download {
        padding: 8px 10px;
        font-size: 13px;
    }

    .help {
        display: none;
    }
}

@media (max-width: 500px) {

    .header {
        padding: 12px 10px 6px;
    }

    .header h1 {
        font-size: 17px;
    }

    .header p {
        font-size: 11px;
    }

    #book {
        height: 65vh;
        min-height: 360px;
    }

    .controls {
        margin-top: 10px;
    }

    button,
    .download {
        font-size: 12px;
        padding: 7px 9px;
    }
}

</style>
</head>


<body>

<div class="header">

    <h1>Derecho Societario Jornadas 2026</h1>

    <p>
        Revista digital
    </p>

</div>


<div class="main">

    <div class="viewer">

        <div id="book-wrapper">

            <div id="zoom-stage">

                <div id="book"></div>

            </div>

            <div id="loading" class="loading">

                <div class="spinner"></div>

                <div id="loadingText">
                    Preparando la revista...
                </div>

            </div>

        </div>


        <div class="controls">

            <button id="prevBtn" title="Página anterior">
                ◀ Anterior
            </button>

            <button id="nextBtn" title="Página siguiente">
                Siguiente ▶
            </button>

            <button id="zoomOutBtn" title="Alejar">
                −
            </button>

            <button id="zoomResetBtn" title="Zoom original">
                100%
            </button>

            <button id="zoomInBtn" title="Acercar">
                +
            </button>

            <button id="fullscreenBtn" title="Pantalla completa">
                ⛶ Pantalla completa
            </button>

            <a
                class="download"
                href="Derecho_Societario_Jornadas_2026.pdf"
                download
                title="Descargar PDF"
            >
                ⬇ Descargar PDF
            </a>

        </div>


        <div class="slider-container">

            <span id="firstPage">
                1
            </span>

            <input
                id="pageSlider"
                type="range"
                min="0"
                max="149"
                value="0"
                step="1"
            >

            <span id="lastPage">
                150
            </span>

        </div>


        <div id="pageInfo">
            Página 1 de 150
        </div>


        <div class="help">

            Arrastrá desde una esquina para pasar la página ·
            Usá la rueda del mouse para hacer zoom ·
            Con zoom, arrastrá para desplazarte

        </div>

    </div>

</div>


<script type="module">

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

const PDF_FILE =
    "Derecho_Societario_Jornadas_2026.pdf";


const bookElement =
    document.getElementById("book");


const bookWrapper =
    document.getElementById("book-wrapper");


const zoomStage =
    document.getElementById("zoom-stage");


const loading =
    document.getElementById("loading");


const loadingText =
    document.getElementById("loadingText");


const pageSlider =
    document.getElementById("pageSlider");


const pageInfo =
    document.getElementById("pageInfo");


const prevBtn =
    document.getElementById("prevBtn");


const nextBtn =
    document.getElementById("nextBtn");


const zoomInBtn =
    document.getElementById("zoomInBtn");


const zoomOutBtn =
    document.getElementById("zoomOutBtn");


const zoomResetBtn =
    document.getElementById("zoomResetBtn");


const fullscreenBtn =
    document.getElementById("fullscreenBtn");


let pdfDocument = null;

let pageFlip = null;

let totalPages = 0;


/* =========================================================
   ZOOM
   ========================================================= */

let zoom = 1;

const MIN_ZOOM = 0.65;

const MAX_ZOOM = 3.0;


/*
   Paso de los botones + y -.
*/

const ZOOM_BUTTON_STEP = 0.10;


/*
   Paso de la rueda.
*/

const ZOOM_WHEEL_STEP = 0.08;


/* =========================================================
   DESPLAZAMIENTO DEL ZOOM
   ========================================================= */

let panX = 0;

let panY = 0;

let isPanning = false;

let panStartX = 0;

let panStartY = 0;

let panOriginX = 0;

let panOriginY = 0;


/* =========================================================
   IMPORTAR PDF.JS
   ========================================================= */

const pdfjsLib =
    await import(
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    );


pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


/* =========================================================
   UTILIDADES
   ========================================================= */

function setLoading(text) {

    loadingText.textContent = text;

}


function hideLoading() {

    loading.classList.add("hidden");

}


function showError(message) {

    loading.classList.remove("hidden");

    loading.innerHTML = `
        <div style="font-size:40px;margin-bottom:10px;">
            ⚠
        </div>

        <div>
            ${message}
        </div>
    `;

}


/* =========================================================
   RENDERIZAR UNA PÁGINA PDF
   ========================================================= */

async function renderPage(pageNumber) {

    const pdfPage =
        await pdfDocument.getPage(pageNumber);


    const viewport =
        pdfPage.getViewport({
            scale: 1.25
        });


    const canvas =
        document.createElement("canvas");


    const context =
        canvas.getContext("2d", {
            alpha: false
        });


    canvas.width =
        Math.ceil(viewport.width);

    canvas.height =
        Math.ceil(viewport.height);


    canvas.style.width =
        "100%";

    canvas.style.height =
        "100%";


    await pdfPage.render({
        canvasContext: context,
        viewport: viewport
    }).promise;


    return canvas;
}


/* =========================================================
   CREAR ENLACES DEL PDF
   ========================================================= */

async function createLinkLayer(
    pdfPage,
    pageElement
) {

    const annotations =
        await pdfPage.getAnnotations({
            intent: "display"
        });


    if (
        !annotations ||
        !annotations.length
    ) {
        return;
    }


    const viewport =
        pdfPage.getViewport({
            scale: 1.25
        });


    const linkLayer =
        document.createElement("div");


    linkLayer.className =
        "link-layer";


    for (
        const annotation of annotations
    ) {

        if (
            annotation.subtype !== "Link"
        ) {
            continue;
        }


        if (
            !annotation.rect
        ) {
            continue;
        }


        const bounds =
            viewport.convertToViewportRectangle(
                annotation.rect
            );


        const left =
            Math.min(
                bounds[0],
                bounds[2]
            );


        const top =
            Math.min(
                bounds[1],
                bounds[3]
            );


        const width =
            Math.abs(
                bounds[2] -
                bounds[0]
            );


        const height =
            Math.abs(
                bounds[3] -
                bounds[1]
            );


        const link =
            document.createElement("a");


        link.className =
            "pdf-link";


        link.style.left =
            `${left / viewport.width * 100}%`;


        link.style.top =
            `${top / viewport.height * 100}%`;


        link.style.width =
            `${width / viewport.width * 100}%`;


        link.style.height =
            `${height / viewport.height * 100}%`;


        /*
           ENLACE EXTERNO
        */

        if (
            annotation.url
        ) {

            link.href =
                annotation.url;

            link.target =
                "_blank";

            link.rel =
                "noopener noreferrer";

        }


        /*
           ENLACE INTERNO
        */

        else if (
            annotation.dest
        ) {

            try {

                let destination =
                    annotation.dest;


                if (
                    typeof destination ===
                    "string"
                ) {

                    destination =
                        await pdfDocument.getDestination(
                            destination
                        );

                }


                if (
                    Array.isArray(
                        destination
                    )
                ) {

                    const ref =
                        destination[0];


                    const targetPageIndex =
                        await pdfDocument.getPageIndex(
                            ref
                        );


                    link.dataset.internalPage =
                        String(
                            targetPageIndex + 1
                        );

                }

            } catch (error) {

                console.warn(
                    "No se pudo resolver enlace interno:",
                    error
                );

            }

        }


        linkLayer.appendChild(
            link
        );

    }


    pageElement.appendChild(
        linkLayer
    );

}


/* =========================================================
   CREAR LAS PÁGINAS
   ========================================================= */

async function createPages() {

    for (
        let pageNumber = 1;
        pageNumber <= totalPages;
        pageNumber++
    ) {

        setLoading(
            `Preparando página ${pageNumber} de ${totalPages}...`
        );


        const pdfPage =
            await pdfDocument.getPage(
                pageNumber
            );


        const viewport =
            pdfPage.getViewport({
                scale: 1.25
            });


        const canvas =
            document.createElement("canvas");


        const context =
            canvas.getContext("2d", {
                alpha: false
            });


        canvas.width =
            Math.ceil(
                viewport.width
            );


        canvas.height =
            Math.ceil(
                viewport.height
            );


        canvas.style.width =
            "100%";


        canvas.style.height =
            "100%";


        await pdfPage.render({
            canvasContext: context,
            viewport: viewport
        }).promise;


        const page =
            document.createElement("div");


        page.className =
            "page";


        /*
           IMPORTANTE:

           No asignamos data-density="hard".

           showCover:true se encarga de las tapas.
        */

        if (
            pageNumber === 1
        ) {

            page.classList.add(
                "cover"
            );

        }


        page.appendChild(
            canvas
        );


        bookElement.appendChild(
            page
        );


        /*
           Recuperamos los enlaces originales
           del PDF.
        */

        await createLinkLayer(
            pdfPage,
            page
        );

    }

}


/* =========================================================
   CREAR STPAGEFLIP
   ========================================================= */

function createFlipbook() {

    const pages =
        document.querySelectorAll(
            ".page"
        );


    const pageWidth = 500;

    const pageHeight = 707;


    pageFlip =
        new St.PageFlip(
            bookElement,
            {

                width: pageWidth,

                height: pageHeight,

                size: "stretch",

                minWidth: 280,

                maxWidth: 650,

                minHeight: 396,

                maxHeight: 920,

                autoSize: true,

                showCover: true,

                usePortrait: true,

                mobileScrollSupport: true,

                useMouseEvents: true,

                swipeDistance: 30,

                flippingTime: 850,

                drawShadow: true,

                maxShadowOpacity: 0.55,

                startPage: 0,

                startZIndex: 0,

                clickEventForward: true,

                disableFlipByClick: false

            }
        );


    pageFlip.on(
        "init",
        function(event) {

            updatePageInfo(
                event.data
            );

        }
    );


    pageFlip.on(
        "flip",
        function(event) {

            updatePageInfo(
                event.data
            );

        }
    );


    pageFlip.on(
        "changeOrientation",
        function() {

            updatePageInfo(
                pageFlip.getCurrentPageIndex()
            );

        }
    );


    pageFlip.loadFromHTML(
        pages
    );

}


/* =========================================================
   INFORMACIÓN DE PÁGINA
   ========================================================= */

function updatePageInfo(index) {

    if (!pageFlip) {
        return;
    }


    const current =
        Math.max(
            0,
            Math.min(
                index,
                totalPages - 1
            )
        );


    pageSlider.value =
        current;


    pageInfo.textContent =
        `Página ${current + 1} de ${totalPages}`;


    prevBtn.disabled =
        current <= 0;


    nextBtn.disabled =
        current >= totalPages - 1;

}


/* =========================================================
   BOTÓN ANTERIOR
   ========================================================= */

prevBtn.addEventListener(
    "click",
    function() {

        if (!pageFlip) {
            return;
        }


        pageFlip.flipPrev(
            "top"
        );

    }
);


/* =========================================================
   BOTÓN SIGUIENTE
   ========================================================= */

nextBtn.addEventListener(
    "click",
    function() {

        if (!pageFlip) {
            return;
        }


        pageFlip.flipNext(
            "top"
        );

    }
);


/* =========================================================
   SLIDER
   ========================================================= */

pageSlider.addEventListener(
    "input",
    function() {

        if (!pageFlip) {
            return;
        }


        const target =
            Number(
                pageSlider.value
            );


        pageFlip.flip(
            target,
            "top"
        );

    }
);


/* =========================================================
   ZOOM
   ========================================================= */

function clampZoom() {

    zoom =
        Math.max(
            MIN_ZOOM,
            Math.min(
                MAX_ZOOM,
                zoom
            )
        );

}


/* =========================================================
   LÍMITES DEL DESPLAZAMIENTO
   ========================================================= */

function clampPan() {

    if (
        zoom <= 1.001
    ) {

        panX = 0;

        panY = 0;

        return;

    }


    const wrapperRect =
        bookWrapper.getBoundingClientRect();


    const stageRect =
        zoomStage.getBoundingClientRect();


    /*
       Calculamos cuánto contenido ampliado
       queda fuera de la ventana visible.
    */

    const scaledWidth =
        stageRect.width;


    const scaledHeight =
        stageRect.height;


    const maxX =
        Math.max(
            0,
            (scaledWidth -
                wrapperRect.width) / 2
        );


    const maxY =
        Math.max(
            0,
            (scaledHeight -
                wrapperRect.height) / 2
        );


    panX =
        Math.max(
            -maxX,
            Math.min(
                maxX,
                panX
            )
        );


    panY =
        Math.max(
            -maxY,
            Math.min(
                maxY,
                panY
            )
        );

}


/* =========================================================
   APLICAR TRANSFORMACIÓN
   ========================================================= */

function applyZoom() {

    clampZoom();


    if (
        zoom <= 1.001
    ) {

        panX = 0;

        panY = 0;

    }


    /*
       Aplicamos primero el desplazamiento
       y luego el zoom.

       #book no se modifica.
    */

    zoomStage.style.transform =
        `translate(${panX}px, ${panY}px) scale(${zoom})`;


    zoomResetBtn.textContent =
        `${Math.round(zoom * 100)}%`;


    if (
        zoom > 1.01
    ) {

        bookElement.style.pointerEvents =
            "none";


        bookWrapper.style.cursor =
            "grab";

    } else {

        bookElement.style.pointerEvents =
            "auto";


        bookWrapper.style.cursor =
            "default";

    }

}


/* =========================================================
   ZOOM +
   ========================================================= */

zoomInBtn.addEventListener(
    "click",
    function() {

        zoom +=
            ZOOM_BUTTON_STEP;


        applyZoom();

    }
);


/* =========================================================
   ZOOM -
   ========================================================= */

zoomOutBtn.addEventListener(
    "click",
    function() {

        zoom -=
            ZOOM_BUTTON_STEP;


        applyZoom();

    }
);


/* =========================================================
   RESET ZOOM
   ========================================================= */

zoomResetBtn.addEventListener(
    "click",
    function() {

        zoom = 1;

        panX = 0;

        panY = 0;


        applyZoom();

    }
);


/* =========================================================
   RUEDA DEL MOUSE
   ========================================================= */

bookWrapper.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();


        /*
           CTRL + rueda:

           zoom.
        */

        if (
            event.ctrlKey
        ) {

            if (
                event.deltaY < 0
            ) {

                zoom +=
                    0.05;

            } else {

                zoom -=
                    0.05;

            }


            applyZoom();

            return;

        }


        /*
           Si estamos ampliados,
           la rueda desplaza la vista.
        */

        if (
            zoom > 1.01
        ) {

            /*
               Rueda vertical.
            */

            panY -=
                event.deltaY;


            /*
               Desplazamiento horizontal
               proporcionado por el touchpad.
            */

            panX -=
                event.deltaX;


            /*
               Shift + rueda:

               desplazamiento horizontal.
            */

            if (
                event.shiftKey &&
                Math.abs(event.deltaX) < 1
            ) {

                panX -=
                    event.deltaY;

            }


            clampPan();


            zoomStage.style.transform =
                `translate(${panX}px, ${panY}px) scale(${zoom})`;


            return;

        }


        /*
           Sin zoom:

           mantenemos el comportamiento
           original de la rueda.
        */

        if (
            event.deltaY < 0
        ) {

            zoom +=
                ZOOM_WHEEL_STEP;

        } else {

            zoom -=
                ZOOM_WHEEL_STEP;

        }


        applyZoom();

    },
    {
        passive: false
    }
);


/* =========================================================
   ARRASTRAR LA REVISTA CON ZOOM
   ========================================================= */

bookWrapper.addEventListener(
    "pointerdown",
    function(event) {

        if (
            zoom <= 1.01
        ) {
            return;
        }


        /*
           Solamente botón izquierdo
           cuando se utiliza mouse.
        */

        if (
            event.pointerType === "mouse" &&
            event.button !== 0
        ) {
            return;
        }


        isPanning = true;


        panStartX =
            event.clientX;


        panStartY =
            event.clientY;


        panOriginX =
            panX;


        panOriginY =
            panY;


        bookWrapper.style.cursor =
            "grabbing";


        try {

            bookWrapper.setPointerCapture(
                event.pointerId
            );

        } catch (error) {}


        event.preventDefault();

    }
);


/* =========================================================
   MOVER LA REVISTA
   ========================================================= */

bookWrapper.addEventListener(
    "pointermove",
    function(event) {

        if (
            !isPanning
        ) {
            return;
        }


        const dx =
            event.clientX -
            panStartX;


        const dy =
            event.clientY -
            panStartY;


        panX =
            panOriginX +
            dx;


        panY =
            panOriginY +
            dy;


        clampPan();


        zoomStage.style.transform =
            `translate(${panX}px, ${panY}px) scale(${zoom})`;


        event.preventDefault();

    }
);


/* =========================================================
   FINALIZAR DESPLAZAMIENTO
   ========================================================= */

function stopPanning(event) {

    if (
        !isPanning
    ) {
        return;
    }


    isPanning = false;


    bookWrapper.style.cursor =
        zoom > 1.01
            ? "grab"
            : "default";


    try {

        bookWrapper.releasePointerCapture(
            event.pointerId
        );

    } catch (error) {}

}


bookWrapper.addEventListener(
    "pointerup",
    stopPanning
);


bookWrapper.addEventListener(
    "pointercancel",
    stopPanning
);


/* =========================================================
   ENLACES INTERNOS DEL PDF
   ========================================================= */

bookElement.addEventListener(
    "click",
    function(event) {

        const link =
            event.target.closest(
                ".pdf-link"
            );


        if (!link) {
            return;
        }


        const targetPage =
            Number(
                link.dataset.internalPage
            );


        if (
            !targetPage ||
            !pageFlip
        ) {
            return;
        }


        event.preventDefault();

        event.stopPropagation();


        pageFlip.flip(
            targetPage - 1,
            "top"
        );

    }
);


/* =========================================================
   PANTALLA COMPLETA
   ========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async function() {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Fullscreen:",
                error
            );

        }

    }
);


document.addEventListener(
    "fullscreenchange",
    function() {

        if (
            document.fullscreenElement
        ) {

            document.body.classList.add(
                "fullscreen"
            );


            fullscreenBtn.textContent =
                "⛶ Salir de pantalla completa";

        } else {

            document.body.classList.remove(
                "fullscreen"
            );


            fullscreenBtn.textContent =
                "⛶ Pantalla completa";

        }


        setTimeout(
            function() {

                if (
                    pageFlip
                ) {

                    pageFlip.update();

                }


                panX = 0;

                panY = 0;

                applyZoom();

            },
            100
        );

    }
);


/* =========================================================
   TECLADO
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (!pageFlip) {
            return;
        }


        if (
            event.target.tagName === "INPUT" ||
            event.target.tagName === "TEXTAREA"
        ) {
            return;
        }


        if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();

            pageFlip.flipPrev(
                "top"
            );

        }


        if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

            pageFlip.flipNext(
                "top"
            );

        }


        if (
            event.key === "+" ||
            event.key === "="
        ) {

            zoom +=
                ZOOM_BUTTON_STEP;


            applyZoom();

        }


        if (
            event.key === "-"
        ) {

            zoom -=
                ZOOM_BUTTON_STEP;


            applyZoom();

        }


        if (
            event.key === "0"
        ) {

            zoom = 1;

            panX = 0;

            panY = 0;


            applyZoom();

        }

    }
);


/* =========================================================
   REDIMENSIONAR
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        if (
            pageFlip
        ) {

            pageFlip.update();

        }


        if (
            zoom > 1.01
        ) {

            clampPan();

        }


        applyZoom();

    }
);


/* =========================================================
   CARGA DEL PDF
   ========================================================= */

async function start() {

    try {

        setLoading(
            "Abriendo el PDF..."
        );


        pdfDocument =
            await pdfjsLib.getDocument(
                PDF_FILE
            ).promise;


        totalPages =
            pdfDocument.numPages;


        pageSlider.max =
            totalPages - 1;


        pageSlider.value =
            0;


        document.getElementById(
            "lastPage"
        ).textContent =
            totalPages;


        await createPages();


        setLoading(
            "Construyendo la revista..."
        );


        createFlipbook();


        setTimeout(
            function() {

                hideLoading();


                zoom = 1;

                panX = 0;

                panY = 0;


                applyZoom();

            },
            400
        );


    } catch (error) {

        console.error(
            "Error real del Flipbook:",
            error
        );


        showError(
            `
            <strong>
                No se pudo inicializar la revista.
            </strong>

            <br><br>

            El archivo PDF fue encontrado, pero ocurrió
            un error al construir el Flipbook.

            <br><br>

            <small>
                ${error.message || error}
            </small>
            `
        );

    }

}


/* =========================================================
   INICIAR
   ========================================================= */

start();

</script>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Derecho Societario Jornadas 2026</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
        type="module"></script>

<!-- StPageFlip -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at center top, #343434 0%, #171717 45%, #090909 100%);
    color: white;
    overflow-x: hidden;
}

/* =========================================================
   CABECERA
   ========================================================= */

.header {
    width: 100%;
    padding: 18px 20px 12px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.3px;
}

.header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: #cfcfcf;
}

/* =========================================================
   CONTENEDOR PRINCIPAL
   ========================================================= */

.main {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 15px 20px;
}

.viewer {
    width: min(96vw, 1500px);
    position: relative;
}

/* =========================================================
   ÁREA DEL FLIPBOOK
   ========================================================= */

#book-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    min-height: 60vh;
    max-height: 78vh;

    border-radius: 8px;

    /* Permite zoom sin cortar el contenido */
    touch-action: none;
}

#book {
    position: relative;

    width: 100%;
    height: 72vh;

    min-height: 500px;
    max-height: 900px;

    margin: 0 auto;

    transition: transform 0.18s ease;
}

/* =========================================================
   PÁGINAS
   ========================================================= */

.page {
    background: white;

    overflow: hidden;

    box-shadow:
        0 0 12px rgba(0,0,0,0.30);

    display: flex;
    justify-content: center;
    align-items: center;
}

.page canvas {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: white;
}

/* Portada */
.page.cover {
    background: white;
}

/* =========================================================
   CARGANDO
   ========================================================= */

.loading {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    z-index: 100;

    background: rgba(0,0,0,0.78);

    padding: 25px 35px;

    border-radius: 10px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.loading.hidden {
    display: none;
}

.spinner {
    width: 42px;
    height: 42px;

    margin: 0 auto 15px;

    border: 4px solid rgba(255,255,255,0.25);
    border-top-color: white;

    border-radius: 50%;

    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   CONTROLES
   ========================================================= */

.controls {
    width: 100%;

    display: flex;
    flex-wrap: wrap;

    justify-content: center;
    align-items: center;

    gap: 8px;

    margin-top: 15px;
}

button,
.download {
    border: none;

    background: #252525;
    color: white;

    padding: 9px 14px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 14px;

    transition:
        background 0.15s ease,
        transform 0.15s ease;
}

button:hover,
.download:hover {
    background: #3c3c3c;
}

button:active,
.download:active {
    transform: scale(0.97);
}

.download {
    text-decoration: none;
}

/* =========================================================
   SLIDER
   ========================================================= */

.slider-container {
    width: min(700px, 90vw);

    display: flex;
    align-items: center;

    gap: 10px;

    margin: 14px auto 0;
}

#pageSlider {
    flex: 1;
    cursor: pointer;
}

#pageInfo {
    min-width: 105px;

    text-align: center;

    font-size: 13px;

    color: #ddd;
}

/* =========================================================
   AYUDA
   ========================================================= */

.help {
    text-align: center;

    color: #aaa;

    font-size: 12px;

    margin-top: 10px;
}

/* =========================================================
   PANTALLA COMPLETA
   ========================================================= */

.fullscreen .header {
    display: none;
}

.fullscreen .main {
    padding: 0;
}

.fullscreen .viewer {
    width: 100vw;
}

.fullscreen #book-wrapper {
    height: 100vh;
    max-height: none;

    border-radius: 0;
}

.fullscreen #book {
    height: 92vh;
}

/* =========================================================
   ERROR
   ========================================================= */

.error {
    max-width: 650px;

    margin: 40px auto;

    padding: 25px;

    background: #421c1c;

    border: 1px solid #813838;

    border-radius: 8px;

    line-height: 1.5;

    text-align: center;
}

.error code {
    color: #ffd6d6;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 800px) {

    .header h1 {
        font-size: 19px;
    }

    .header p {
        font-size: 12px;
    }

    #book {
        height: 70vh;
        min-height: 420px;
    }

    .controls {
        gap: 6px;
    }

    button,
    .download {
        padding: 8px 10px;
        font-size: 13px;
    }

    .help {
        display: none;
    }
}

@media (max-width: 500px) {

    .header {
        padding: 12px 10px 6px;
    }

    .header h1 {
        font-size: 17px;
    }

    .header p {
        font-size: 11px;
    }

    #book {
        height: 65vh;
        min-height: 360px;
    }

    .controls {
        margin-top: 10px;
    }

    button,
    .download {
        font-size: 12px;
        padding: 7px 9px;
    }
}

</style>
</head>


<body>

<div class="header">

    <h1>Derecho Societario Jornadas 2026</h1>

    <p>
        Revista digital
    </p>

</div>


<div class="main">

    <div class="viewer">

        <div id="book-wrapper">

            <div id="book"></div>

            <div id="loading" class="loading">

                <div class="spinner"></div>

                <div id="loadingText">
                    Preparando la revista...
                </div>

            </div>

        </div>


        <div class="controls">

            <button id="prevBtn" title="Página anterior">
                ◀ Anterior
            </button>

            <button id="nextBtn" title="Página siguiente">
                Siguiente ▶
            </button>

            <button id="zoomOutBtn" title="Alejar">
                −
            </button>

            <button id="zoomResetBtn" title="Zoom original">
                100%
            </button>

            <button id="zoomInBtn" title="Acercar">
                +
            </button>

            <button id="fullscreenBtn" title="Pantalla completa">
                ⛶ Pantalla completa
            </button>

            <a
                class="download"
                href="Derecho_Societario_Jornadas_2026.pdf"
                download
                title="Descargar PDF"
            >
                ⬇ Descargar PDF
            </a>

        </div>


        <div class="slider-container">

            <span id="firstPage">
                1
            </span>

            <input
                id="pageSlider"
                type="range"
                min="0"
                max="149"
                value="0"
                step="1"
            >

            <span id="lastPage">
                150
            </span>

        </div>


        <div id="pageInfo">
            Página 1 de 150
        </div>


        <div class="help">

            Arrastrá desde una esquina para pasar la página ·
            Usá la rueda del mouse para hacer zoom ·
            En celular, deslizá con el dedo

        </div>

    </div>

</div>


<script type="module">

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

const PDF_FILE = "Derecho_Societario_Jornadas_2026.pdf";

const bookElement = document.getElementById("book");
const bookWrapper = document.getElementById("book-wrapper");

const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");

const pageSlider = document.getElementById("pageSlider");
const pageInfo = document.getElementById("pageInfo");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const zoomInBtn = document.getElementById("zoomInBtn");
const zoomOutBtn = document.getElementById("zoomOutBtn");
const zoomResetBtn = document.getElementById("zoomResetBtn");

const fullscreenBtn = document.getElementById("fullscreenBtn");

let pdfDocument = null;
let pageFlip = null;

let totalPages = 0;

let zoom = 1;


/* =========================================================
   IMPORTAR PDF.JS
   ========================================================= */

const pdfjsLib =
    await import(
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    );

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


/* =========================================================
   UTILIDADES
   ========================================================= */

function setLoading(text) {

    loadingText.textContent = text;

}


function hideLoading() {

    loading.classList.add("hidden");

}


function showError(message) {

    loading.classList.remove("hidden");

    loading.innerHTML = `
        <div style="font-size:40px;margin-bottom:10px;">
            ⚠
        </div>

        <div>
            ${message}
        </div>
    `;

}


/* =========================================================
   RENDERIZAR UNA PÁGINA PDF
   ========================================================= */

async function renderPage(pageNumber) {

    const pdfPage =
        await pdfDocument.getPage(pageNumber);

    /*
       Escala moderada para no consumir una cantidad
       exagerada de memoria con 150 páginas.
    */

    const viewport =
        pdfPage.getViewport({
            scale: 1.25
        });

    const canvas =
        document.createElement("canvas");

    const context =
        canvas.getContext("2d", {
            alpha: false
        });

    canvas.width =
        Math.ceil(viewport.width);

    canvas.height =
        Math.ceil(viewport.height);

    canvas.style.width = "100%";
    canvas.style.height = "100%";

    await pdfPage.render({
        canvasContext: context,
        viewport: viewport
    }).promise;

    return canvas;
}


/* =========================================================
   CREAR LAS PÁGINAS DEL FLIPBOOK
   ========================================================= */

async function createPages() {

    for (
        let pageNumber = 1;
        pageNumber <= totalPages;
        pageNumber++
    ) {

        setLoading(
            `Preparando página ${pageNumber} de ${totalPages}...`
        );

        const canvas =
            await renderPage(pageNumber);

        const page =
            document.createElement("div");

        page.className = "page";

        /*
           La portada es una tapa rígida.
        */

        if (pageNumber === 1) {

            page.classList.add("cover");

            page.dataset.density = "hard";

        }

        /*
           También tratamos la última página como tapa
           para que el libro tenga un cierre correcto.
        */

        if (pageNumber === totalPages) {

            page.dataset.density = "hard";

        }

        page.appendChild(canvas);

        bookElement.appendChild(page);

    }

}


/* =========================================================
   CREAR STPAGEFLIP
   ========================================================= */

function createFlipbook() {

    const pages =
        document.querySelectorAll(".page");


    /*
       Relación aproximada A4.
       StPageFlip necesita una dimensión base.
    */

    const pageWidth = 500;
    const pageHeight = 707;


    pageFlip =
        new St.PageFlip(
            bookElement,
            {

                width: pageWidth,

                height: pageHeight,

                size: "stretch",

                minWidth: 280,

                maxWidth: 650,

                minHeight: 396,

                maxHeight: 920,

                autoSize: true,

                showCover: true,

                usePortrait: true,

                mobileScrollSupport: true,

                useMouseEvents: true,

                swipeDistance: 30,

                flippingTime: 850,

                drawShadow: true,

                maxShadowOpacity: 0.55,

                startPage: 0,

                startZIndex: 0,

                disableFlipByClick: false

            }
        );


    /*
       IMPORTANTE:
       Registramos el evento ANTES de cargar
       las páginas.
    */

    pageFlip.on(
        "init",
        function(event) {

            updatePageInfo(
                event.data
            );

        }
    );


    pageFlip.on(
        "flip",
        function(event) {

            updatePageInfo(
                event.data
            );

        }
    );


    pageFlip.on(
        "changeOrientation",
        function(event) {

            /*
               Al cambiar entre vertical/horizontal
               actualizamos la interfaz.
            */

            updatePageInfo(
                pageFlip.getCurrentPageIndex()
            );

        }
    );


    /*
       Cargamos las páginas HTML.
    */

    pageFlip.loadFromHTML(
        pages
    );

}


/* =========================================================
   INFORMACIÓN DE PÁGINA
   ========================================================= */

function updatePageInfo(index) {

    if (!pageFlip) {
        return;
    }

    const current =
        Math.max(
            0,
            Math.min(
                index,
                totalPages - 1
            )
        );


    pageSlider.value =
        current;


    /*
       En modo portada mostramos una página.
       En modo revista mostramos la página inicial
       del pliego.
    */

    const displayPage =
        current + 1;


    pageInfo.textContent =
        `Página ${displayPage} de ${totalPages}`;


    /*
       Actualizamos botones.
    */

    prevBtn.disabled =
        current <= 0;


    nextBtn.disabled =
        current >= totalPages - 1;

}


/* =========================================================
   BOTÓN ANTERIOR
   ========================================================= */

prevBtn.addEventListener(
    "click",
    function() {

        if (!pageFlip) {
            return;
        }

        /*
           TOP hace que la animación se origine
           desde la esquina superior.
        */

        pageFlip.flipPrev("top");

    }
);


/* =========================================================
   BOTÓN SIGUIENTE
   ========================================================= */

nextBtn.addEventListener(
    "click",
    function() {

        if (!pageFlip) {
            return;
        }

        pageFlip.flipNext("top");

    }
);


/* =========================================================
   SLIDER
   ========================================================= */

pageSlider.addEventListener(
    "input",
    function() {

        if (!pageFlip) {
            return;
        }

        const target =
            Number(
                pageSlider.value
            );

        /*
           Para navegación directa utilizamos
           animación desde la esquina superior.
        */

        pageFlip.flip(
            target,
            "top"
        );

    }
);


/* =========================================================
   ZOOM
   ========================================================= */

function updateZoom() {

    /*
       Limitamos el zoom para evitar que el libro
       desaparezca completamente de la pantalla.
    */

    zoom =
        Math.max(
            0.65,
            Math.min(
                2.5,
                zoom
            )
        );


    bookElement.style.transform =
        `scale(${zoom})`;


    zoomResetBtn.textContent =
        `${Math.round(zoom * 100)}%`;

}


zoomInBtn.addEventListener(
    "click",
    function() {

        zoom += 0.10;

        updateZoom();

    }
);


zoomOutBtn.addEventListener(
    "click",
    function() {

        zoom -= 0.10;

        updateZoom();

    }
);


zoomResetBtn.addEventListener(
    "click",
    function() {

        zoom = 1;

        updateZoom();

    }
);


/* =========================================================
   ZOOM CON RUEDA DEL MOUSE
   ========================================================= */

bookWrapper.addEventListener(
    "wheel",
    function(event) {

        /*
           Evitamos que la página web haga scroll
           mientras el cursor está sobre la revista.
        */

        event.preventDefault();


        /*
           Delta positivo:
           rueda hacia abajo -> alejamos.

           Delta negativo:
           rueda hacia arriba -> acercamos.
        */

        if (event.deltaY < 0) {

            zoom += 0.08;

        } else {

            zoom -= 0.08;

        }

        updateZoom();

    },
    {
        passive: false
    }
);


/* =========================================================
   CTRL + RUEDA
   ========================================================= */

document.addEventListener(
    "wheel",
    function(event) {

        if (!event.ctrlKey) {
            return;
        }

        event.preventDefault();


        if (event.deltaY < 0) {

            zoom += 0.05;

        } else {

            zoom -= 0.05;

        }

        updateZoom();

    },
    {
        passive: false
    }
);


/* =========================================================
   PANTALLA COMPLETA
   ========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async function() {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Fullscreen:",
                error
            );

        }

    }
);


document.addEventListener(
    "fullscreenchange",
    function() {

        if (document.fullscreenElement) {

            document.body.classList.add(
                "fullscreen"
            );

            fullscreenBtn.textContent =
                "⛶ Salir de pantalla completa";

        } else {

            document.body.classList.remove(
                "fullscreen"
            );

            fullscreenBtn.textContent =
                "⛶ Pantalla completa";

        }

    }
);


/* =========================================================
   TECLADO
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (!pageFlip) {
            return;
        }


        /*
           No interferimos si el usuario está
           escribiendo en un campo.
        */

        if (
            event.target.tagName === "INPUT" ||
            event.target.tagName === "TEXTAREA"
        ) {
            return;
        }


        if (event.key === "ArrowLeft") {

            event.preventDefault();

            pageFlip.flipPrev("top");

        }


        if (event.key === "ArrowRight") {

            event.preventDefault();

            pageFlip.flipNext("top");

        }


        if (event.key === "+" || event.key === "=") {

            zoom += 0.10;

            updateZoom();

        }


        if (event.key === "-") {

            zoom -= 0.10;

            updateZoom();

        }


        if (event.key === "0") {

            zoom = 1;

            updateZoom();

        }

    }
);


/* =========================================================
   CARGA DEL PDF
   ========================================================= */

async function start() {

    try {

        setLoading(
            "Abriendo el PDF..."
        );


        pdfDocument =
            await pdfjsLib.getDocument(
                PDF_FILE
            ).promise;


        totalPages =
            pdfDocument.numPages;


        /*
           Actualizamos slider.
        */

        pageSlider.max =
            totalPages - 1;

        pageSlider.value = 0;


        document.getElementById(
            "lastPage"
        ).textContent =
            totalPages;


        /*
           Creamos las páginas.
        */

        await createPages();


        setLoading(
            "Construyendo la revista..."
        );


        /*
           Creamos el motor de flipbook.
        */

        createFlipbook();


        /*
           Ocultamos el indicador.
        */

        setTimeout(
            function() {

                hideLoading();

                updateZoom();

            },
            400
        );

    } catch (error) {

    console.error(
        "Error real del Flipbook:",
        error
    );

    showError(
        `
        <strong>No se pudo inicializar la revista.</strong>

        <br><br>

        El archivo PDF fue encontrado, pero ocurrió
        un error al construir el Flipbook.

        <br><br>

        <small>
        ${error.message || error}
        </small>
        `
    );

}

}


/* =========================================================
   INICIAR
   ========================================================= */

start();

</script>

</body>
</html>

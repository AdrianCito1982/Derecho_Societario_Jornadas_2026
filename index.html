<style>

/* =========================================================
   GENERAL
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    font-family:
        Arial,

            circle at center top,

        0

}


/* =========================================================
   MAIN
   ========================================================= */

.main {

    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    padding:
        10px
        15px
        25px;
}

.viewer {

}


/* =========================================================
   BOOK WRAPPER
   ========================================================= */

#book-wrapper {
    width: 100%;
    height: 78vh;
    min-height: 60vh;

    display: block;

    overflow: auto;

    position: relative;

    border-radius: 8px;

    scrollbar-width: thin;
}

/*
   Cuando estamos haciendo zoom,
   el cursor indica que podemos desplazar
   el documento.
*/
#book-wrapper.zoomed {
    cursor: grab;
}

#book-wrapper.zoomed:active {
    cursor: grabbing;
}


/* =========================================================
   BOOK
   ========================================================= */

#book {
    position: relative;

    width: 100%;

    height: 72vh;

    min-height: 500px;

    max-height: 900px;

    margin: 0 auto;

    transform-origin: top left;

    transition: transform 0.12s ease;
}


/* =========================================================
   PÁGINAS
   ========================================================= */

.page {

    position: relative;

    background: white;

    overflow: hidden;

    box-shadow:
        0
        0
        12px
        rgba(
            0,
            0,
            0,
            0.30
        );

    display: flex;

    justify-content: center;

    align-items: center;
}


/*
   El canvas ocupa toda la página.
*/

.page canvas {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: contain;

    background: white;
}


/* =========================================================
   CAPA DE ENLACES
   ========================================================= */

/*
   Los enlaces están por encima del canvas,
   pero son transparentes.

   De esta manera el PDF conserva su
   interactividad sin modificar su aspecto.
*/

.link-layer {

    position: absolute;

    inset: 0;

    z-index: 20;

    pointer-events: none;
}


.pdf-link {

    position: absolute;

    display: block;

    pointer-events: auto;

    background: transparent;

    cursor: pointer;

    text-decoration: none;

    border: none;

    outline: none;
}


/*
   Cuando pasamos por encima de un enlace,
   podemos mostrar una señal muy sutil.

   Si preferís que sea totalmente invisible,
   esta regla no modifica visualmente nada.
*/

.pdf-link:hover {

    background:
        rgba(
            30,
            100,
            200,
            0.04
        );
}


/* =========================================================
   LOADING
   ========================================================= */

.loading {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    text-align: center;

    z-index: 100;

    background:
        rgba(
            0,
            0,
            0,
            0.82
        );

    padding:
        25px
        35px;

    border-radius: 10px;

    box-shadow:
        0
        10px
        30px
        rgba(
            0,
            0,
            0,
            0.4
        );
}

.loading.hidden {

    display: none;
}

.spinner {

    width: 42px;

    height: 42px;

    margin:
        0
        auto
        15px;

    border:
        4px
        solid
        rgba(
            255,
            255,
            255,
            0.25
        );

    border-top-color:
        white;

    border-radius: 50%;

    animation:
        spin
        0.8s
        linear
        infinite;
}

@keyframes spin {

    to {

    }
}


/* =========================================================

/* =========================================================

<!-- =====================================================

     ===================================================== -->

<script type="module">


/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

const PDF_FILE =
    "Derecho_Societario_Jornadas_2026.pdf";


const PDFJS_VERSION =
    "4.10.38";


/* =========================================================
   ELEMENTOS
   ========================================================= */

const bookElement =
    document.getElementById(
        "book"
    );

const bookWrapper =
    document.getElementById(
        "book-wrapper"
    );

const loading =
    document.getElementById(
        "loading"
    );

const loadingText =
    document.getElementById(
        "loadingText"
    );

const pageSlider =
    document.getElementById(
        "pageSlider"
    );

const pageInfo =
    document.getElementById(
        "pageInfo"
    );

const prevBtn =
    document.getElementById(
        "prevBtn"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const zoomInBtn =
    document.getElementById(
        "zoomInBtn"
    );

const zoomOutBtn =
    document.getElementById(
        "zoomOutBtn"
    );

const zoomResetBtn =
    document.getElementById(
        "zoomResetBtn"
    );

const fullscreenBtn =
    document.getElementById(
        "fullscreenBtn"
    );


/* =========================================================
   VARIABLES
   ========================================================= */

let pdfDocument =
    null;

let pageFlip =
    null;

let totalPages =
    0;

let zoom =
    1;


/*
   Mapa de destinos internos.

   Lo utilizamos para resolver:
   índice -> capítulo -> página.
*/

const destinationCache =
    new Map();


/* =========================================================
   PDF.JS
   ========================================================= */

const pdfjsLib =
    await import(
        `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.min.mjs`
    );


pdfjsLib.GlobalWorkerOptions.workerSrc =
    `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.mjs`;


/* =========================================================
   LOADING
   ========================================================= */

function setLoading(
    text
) {

    loadingText.textContent =
        text;
}


function hideLoading() {

    loading.classList.add(
        "hidden"
    );
}


function showError(
    message
) {

    loading.classList.remove(
        "hidden"
    );

    loading.innerHTML = `

        <div
            style="
                font-size:40px;
                margin-bottom:10px;
            "
        >
            ⚠
        </div>

        <div>
            ${message}
        </div>

    `;
}


/* =========================================================
   RESOLVER DESTINO PDF
   ========================================================= */

/*
   PDF.js puede entregar destinos de dos maneras:

   1. Como nombre:
      "chapter1"

   2. Como array:
      [ref, "XYZ", x, y, zoom]

   Esta función convierte cualquiera de ellos
   en un número de página del PDF.
*/

async function resolveDestination(
    destination
) {

    if (!destination) {

        return null;
    }


    /*
       Si es un nombre de destino.
    */

    if (
        typeof destination === "string"
    ) {

        if (
            destinationCache.has(
                destination
            )
        ) {

            return destinationCache.get(
                destination
            );
        }


        const resolved =
            await pdfDocument.getDestination(
                destination
            );


        if (!resolved) {

            return null;
        }


        const pageNumber =
            await resolveDestination(
                resolved
            );


        destinationCache.set(
            destination,
            pageNumber
        );


        return pageNumber;
    }


    /*
       Si es un destino explícito.
    */

    if (
        Array.isArray(
            destination
        )
    ) {

        const ref =
            destination[0];


        if (!ref) {

            return null;
        }


        /*
           El primer elemento suele ser
           la referencia interna a la página.
        */

        if (
            typeof ref === "object"
        ) {

            try {

                const index =
                    await pdfDocument.getPageIndex(
                        ref
                    );

                return index + 1;

            } catch (
                error
            ) {

                console.warn(
                    "No se pudo resolver destino:",
                    destination,
                    error
                );

                return null;
            }
        }
    }


    return null;
}


/* =========================================================
   CREAR CAPA DE ENLACES
   ========================================================= */

async function createLinkLayer(
    pdfPage,
    viewport,
    pageElement
) {

    const annotations =
        await pdfPage.getAnnotations({
            intent: "display"
        });


    if (
        !annotations ||
        annotations.length === 0
    ) {

        return;
    }


    const linkLayer =
        document.createElement(
            "div"
        );


    linkLayer.className =
        "link-layer";


    /*
       El ancho/alto virtual coincide con
       el viewport utilizado por el canvas.
    */

    linkLayer.dataset.width =
        viewport.width;

    linkLayer.dataset.height =
        viewport.height;


    for (
        const annotation
        of annotations
    ) {

        /*
           Solamente nos interesan
           anotaciones de tipo Link.
        */

        if (
            annotation.subtype !== "Link"
        ) {

            continue;
        }


        if (
            !annotation.rect
        ) {

            continue;
        }


        /*
           PDF.js devuelve las coordenadas
           del rectángulo en coordenadas PDF.

           convertToViewportRectangle()
           las transforma a coordenadas
           de pantalla.
        */

        const rect =
            viewport.convertToViewportRectangle(
                annotation.rect
            );


        const left =
            Math.min(
                rect[0],
                rect[2]
            );

        const top =
            Math.min(
                rect[1],
                rect[3]
            );

        const width =
            Math.abs(
                rect[2] -
                rect[0]
            );

        const height =
            Math.abs(
                rect[3] -
                rect[1]
            );


        /*
           Convertimos a porcentajes.

           Esto es importante porque StPageFlip
           puede redimensionar las páginas.
        */

        const leftPercent =
            (
                left /
                viewport.width
            ) * 100;

        const topPercent =
            (
                top /
                viewport.height
            ) * 100;

        const widthPercent =
            (
                width /
                viewport.width
            ) * 100;

        const heightPercent =
            (
                height /
                viewport.height
            ) * 100;


        const link =
            document.createElement(
                "a"
            );


        link.className =
            "pdf-link";


        link.style.left =
            `${leftPercent}%`;

        link.style.top =
            `${topPercent}%`;

        link.style.width =
            `${widthPercent}%`;

        link.style.height =
            `${heightPercent}%`;


        /*
           -------------------------------------------------
           ENLACE EXTERNO
           -------------------------------------------------
        */

        if (
            annotation.url
        ) {

            link.href =
                annotation.url;


            link.target =
                "_blank";


            link.rel =
                "noopener noreferrer";


            link.title =
                "Abrir enlace";

        }


        /*
           -------------------------------------------------
           ENLACE INTERNO
           -------------------------------------------------
        */

        else if (
            annotation.dest
        ) {

            const targetPage =
                await resolveDestination(
                    annotation.dest
                );


            if (
                targetPage
            ) {

                link.href =
                    "#pagina-" +
                    targetPage;


                link.dataset.internalPage =
                    targetPage;


                link.title =
                    `Ir a página ${targetPage}`;

            }

        }


        /*
           Si no pudimos resolver el enlace,
           no lo agregamos.
        */

        if (
            !link.href
        ) {

            continue;
        }


        linkLayer.appendChild(
            link
        );

    }


    pageElement.appendChild(
        linkLayer
    );
}


/* =========================================================
   RENDERIZAR PÁGINA
   ========================================================= */

async function renderPage(
    pageNumber
) {

    const pdfPage =
        await pdfDocument.getPage(
            pageNumber
        );


    /*
       1.25 es una buena relación entre
       calidad y memoria para 150 páginas.
    */

    const viewport =
        pdfPage.getViewport({
            scale: 1.25
        });


    const canvas =
        document.createElement(
            "canvas"
        );


    const context =
        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );


    canvas.width =
        Math.ceil(
            viewport.width
        );


    canvas.height =
        Math.ceil(
            viewport.height
        );


    canvas.style.width =
        "100%";

    canvas.style.height =
        "100%";


    await pdfPage.render({

        canvasContext:
            context,

        viewport:
            viewport

    }).promise;


    /*
       Creamos el contenedor HTML
       de la página.
    */

    const pageElement =
        document.createElement(
            "div"
        );


    pageElement.className =
        "page";


    pageElement.dataset.page =
        pageNumber;


    pageElement.id =
        `pagina-${pageNumber}`;


    pageElement.appendChild(
        canvas
    );


    /*
       IMPORTANTE:

       Recuperamos las anotaciones del PDF
       y las colocamos sobre el canvas.

       Así recuperamos los enlaces del índice
       y los enlaces externos.
    */

    await createLinkLayer(
        pdfPage,
        viewport,
        pageElement
    );


    return pageElement;
}


/* =========================================================
   CREAR TODAS LAS PÁGINAS
   ========================================================= */

async function createPages() {

    const pages =
        [];


    for (
        let pageNumber = 1;
        pageNumber <= totalPages;
        pageNumber++
    ) {

        setLoading(
            `Preparando página ${pageNumber} de ${totalPages}...`
        );


        const page =
            await renderPage(
                pageNumber
            );


        /*
           MUY IMPORTANTE:

           NO agregamos data-density="hard"
           manualmente.

           showCover:true se ocupa de convertir
           la primera y última página en tapas.
        */

        pages.push(
            page
        );


        bookElement.appendChild(
            page
        );
    }


    return pages;
}


/* =========================================================
   CREAR FLIPBOOK
   ========================================================= */

function createFlipbook(
    pages
) {

    const pageWidth =
        500;

    const pageHeight =
        707;


    pageFlip =
        new St.PageFlip(
            bookElement,
            {

                width:
                    pageWidth,

                height:
                    pageHeight,

                size:
                    "stretch",

                minWidth:
                    280,

                maxWidth:
                    650,

                minHeight:
                    396,

                maxHeight:
                    920,

                autoSize:
                    true,

                /*
                   LA CLAVE PARA LA PORTADA.

                   Primera y última página
                   aparecen solas.
                */

                showCover:
                    true,

                usePortrait:
                    true,

                mobileScrollSupport:
                    true,

                useMouseEvents:
                    true,

                swipeDistance:
                    30,

                flippingTime:
                    850,

                drawShadow:
                    true,

                maxShadowOpacity:
                    0.55,

                startPage:
                    0,

                startZIndex:
                    0,

                /*
                   Permite que los clicks lleguen
                   a los enlaces <a> internos.
                */

                clickEventForward:
                    true,

                disableFlipByClick:
                    false

            }
        );


    /*
       Evento INIT.
    */

    pageFlip.on(
        "init",
        function(event) {

            updatePageInfo(
                event.data
            );

        }
    );


    /*
       Evento FLIP.
    */

    pageFlip.on(
        "flip",
        function(event) {

            updatePageInfo(
                event.data
            );

        }
    );


    /*
       Cambio de orientación.
    */

    pageFlip.on(
        "changeOrientation",
        function(event) {

            updatePageInfo(
                pageFlip.getCurrentPageIndex()
            );

        }
    );


    /*
       Cargamos las páginas HTML.

       La API de StPageFlip utiliza
       loadFromHTML().
    */

    pageFlip.loadFromHTML(
        pages
    );
}


/* =========================================================
   INFORMACIÓN DE PÁGINA
   ========================================================= */

function updatePageInfo(
    index
) {

    if (!pageFlip) {

        return;
    }


    const current =
        Math.max(
            0,
            Math.min(
                index,
                totalPages - 1
            )
        );


    pageSlider.value =
        current;


    /*
       Si estamos en la portada:
       Página 1 de 150

       Si estamos en el interior:
       mostramos el inicio del pliego.
    */

    const displayPage =
        current + 1;


    pageInfo.textContent =
        `Página ${displayPage} de ${totalPages}`;


    prevBtn.disabled =
        current <= 0;


    nextBtn.disabled =
        current >=
        totalPages - 1;
}


/* =========================================================
   NAVEGACIÓN ANTERIOR
   ========================================================= */

prevBtn.addEventListener(
    "click",
    function() {

        if (!pageFlip) {

            return;
        }


        /*
           La esquina superior izquierda
           es el origen del retroceso.
        */

        pageFlip.flipPrev(
            "bottom"
        );
    }
);


/* =========================================================
   NAVEGACIÓN SIGUIENTE
   ========================================================= */

nextBtn.addEventListener(
    "click",
    function() {

        if (!pageFlip) {

            return;
        }


        /*
           La esquina superior derecha
           es el origen del avance.
        */

        pageFlip.flipNext(
            "top"
        );
    }
);


/* =========================================================
   SLIDER
   ========================================================= */

pageSlider.addEventListener(
    "input",
    function() {

        if (!pageFlip) {

            return;
        }


        const target =
            Number(
                pageSlider.value
            );


        /*
           Saltamos con animación.

           StPageFlip resuelve internamente
           el spread correspondiente.
        */

        pageFlip.flip(
            target,
            "top"
        );
    }
);


/* =========================================================
   ZOOM
   ========================================================= */

function updateZoom() {

    zoom =
        Math.max(
            0.65,
            Math.min(
                3.0,
                zoom
            )
        );

    bookElement.style.transform =
        `scale(${zoom})`;

    zoomResetBtn.textContent =
        `${Math.round(zoom * 100)}%`;


    /*
       Cuando estamos ampliados,
       activamos el modo lectura/paneo.
    */

    if (zoom > 1.01) {

        bookWrapper.classList.add(
            "zoomed"
        );

        /*
           El flipbook deja de recibir
           los eventos del mouse.

           Así podemos arrastrar el documento
           sin pasar páginas accidentalmente.
        */

        bookElement.style.pointerEvents =
            "none";

    } else {

        bookWrapper.classList.remove(
            "zoomed"
        );

        bookElement.style.pointerEvents =
            "auto";
    }
}


/* =========================================================
   PANEo DEL DOCUMENTO AMPLIADO
   ========================================================= */

let isPanning = false;

let panStartX = 0;
let panStartY = 0;

let scrollStartLeft = 0;
let scrollStartTop = 0;


bookWrapper.addEventListener(
    "pointerdown",
    function(event) {

        if (zoom <= 1.01) {
            return;
        }

        /*
           Solamente paneamos con botón izquierdo
           del mouse o touch.
        */

        if (
            event.pointerType === "mouse" &&
            event.button !== 0
        ) {
            return;
        }

        isPanning = true;

        panStartX = event.clientX;
        panStartY = event.clientY;

        scrollStartLeft =
            bookWrapper.scrollLeft;

        scrollStartTop =
            bookWrapper.scrollTop;

        bookWrapper.classList.add(
            "zoomed"
        );

        bookWrapper.setPointerCapture(
            event.pointerId
        );

        event.preventDefault();
    }
);


bookWrapper.addEventListener(
    "pointermove",
    function(event) {

        if (
            !isPanning ||
            zoom <= 1.01
        ) {
            return;
        }

        const dx =
            event.clientX -
            panStartX;

        const dy =
            event.clientY -
            panStartY;


        bookWrapper.scrollLeft =
            scrollStartLeft -
            dx;

        bookWrapper.scrollTop =
            scrollStartTop -
            dy;

        event.preventDefault();
    }
);


bookWrapper.addEventListener(
    "pointerup",
    function(event) {

        isPanning = false;

        try {

            bookWrapper.releasePointerCapture(
                event.pointerId
            );

        } catch (error) {
            /* nada */
        }
    }
);


bookWrapper.addEventListener(
    "pointercancel",
    function() {

        isPanning = false;

    }
);


/* =========================================================
   ZOOM +
   ========================================================= */

zoomInBtn.addEventListener(
    "click",
    function() {

        zoom += 0.10;

        updateZoom();
    }
);


/* =========================================================
   ZOOM -
   ========================================================= */

zoomOutBtn.addEventListener(
    "click",
    function() {

        zoom -= 0.10;

        updateZoom();
    }
);


/* =========================================================
   ZOOM RESET
   ========================================================= */

zoomResetBtn.addEventListener(
    "click",
    function() {

        zoom = 1;

        updateZoom();
    }
);


/* =========================================================
   ZOOM CON RUEDA
   ========================================================= */

bookWrapper.addEventListener(
    "wheel",
    function(event) {

        /*
           Si estamos ampliados:
           la rueda desplaza verticalmente
           el documento.
        */

        if (zoom > 1.01) {

            event.preventDefault();

            bookWrapper.scrollTop +=
                event.deltaY;

            bookWrapper.scrollLeft +=
                event.deltaX;

            return;
        }


        /*
           Si estamos al 100%:
           la rueda controla el zoom.
        */

        event.preventDefault();


        if (event.deltaY < 0) {

            zoom += 0.08;

        } else {

            zoom -= 0.08;
        }


        updateZoom();

    },
    {
        passive: false
    }
);


/* =========================================================
   CTRL + RUEDA
   ========================================================= */

document.addEventListener(
    "wheel",
    function(event) {

        if (
            !event.ctrlKey
        ) {

            return;
        }


        event.preventDefault();


        if (
            event.deltaY < 0
        ) {

            zoom += 0.05;

        } else {

            zoom -= 0.05;
        }


        updateZoom();

    },
    {
        passive: false
    }
);


/* =========================================================
   ENLACES INTERNOS DEL PDF
   ========================================================= */

/*
   Utilizamos delegación de eventos.

   Esto es importante porque StPageFlip puede
   clonar elementos HTML cuando cambia a modo
   vertical/portrait.

   Por eso NO dependemos de listeners instalados
   individualmente sobre cada enlace.
*/

bookElement.addEventListener(
    "click",
    function(event) {

        const link =
            event.target.closest(
                ".pdf-link"
            );


        if (!link) {

            return;
        }


        const target =
            link.dataset.internalPage;


        /*
           Si no es un enlace interno,
           dejamos que el navegador maneje
           el enlace externo normalmente.
        */

        if (!target) {

            return;
        }


        event.preventDefault();

        event.stopPropagation();


        const targetPage =
            Number(
                target
            );


        if (
            !pageFlip ||
            !targetPage
        ) {

            return;
        }


        /*
           Convertimos número de página PDF
           a índice StPageFlip.

           PDF:
           página 1

           StPageFlip:
           índice 0
        */

        const targetIndex =
            targetPage - 1;


        /*
           Si el destino ya es la página actual,
           no hacemos nada.
        */

        if (
            targetIndex ===
            pageFlip.getCurrentPageIndex()
        ) {

            return;
        }


        /*
           Salto animado.
        */

        pageFlip.flip(
            targetIndex,
            "top"
        );

    }
);


/* =========================================================
   PANTALLA COMPLETA
   ========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async function() {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document
                    .documentElement
                    .requestFullscreen();

            } else {

                await document
                    .exitFullscreen();
            }

        } catch (
            error
        ) {

            console.error(
                "Fullscreen:",
                error
            );
        }
    }
);


/* =========================================================
   CAMBIO DE PANTALLA COMPLETA
   ========================================================= */

document.addEventListener(
    "fullscreenchange",
    function() {

        if (
            document.fullscreenElement
        ) {

            document.body.classList.add(
                "fullscreen"
            );

            fullscreenBtn.textContent =
                "⛶ Salir de pantalla completa";

        } else {

            document.body.classList.remove(
                "fullscreen"
            );

            fullscreenBtn.textContent =
                "⛶ Pantalla completa";
        }
    }
);


/* =========================================================
   TECLADO
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (!pageFlip) {

            return;
        }


        if (
            event.target.tagName === "INPUT" ||
            event.target.tagName === "TEXTAREA"
        ) {

            return;
        }


        /*
           Página anterior
        */

        if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();

            pageFlip.flipPrev(
                "bottom"
            );
        }


        /*
           Página siguiente
        */

        if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

            pageFlip.flipNext(
                "top"
            );
        }


        /*
           Zoom +
        */

        if (
            event.key === "+" ||
            event.key === "="
        ) {

            zoom += 0.10;

            updateZoom();
        }


        /*
           Zoom -
        */

        if (
            event.key === "-"
        ) {

            zoom -= 0.10;

            updateZoom();
        }


        /*
           Zoom 100%
        */

        if (
            event.key === "0"
        ) {

            zoom = 1;

            updateZoom();
        }
    }
);


/* =========================================================
   CARGAR PDF
   ========================================================= */

async function start() {

    try {

        setLoading(
            "Abriendo el PDF..."
        );


        /*
           Abrimos el PDF.
        */

        pdfDocument =
            await pdfjsLib.getDocument(
                PDF_FILE
            ).promise;


        totalPages =
            pdfDocument.numPages;


        /*
           Configuramos slider.
        */

        pageSlider.max =
            totalPages - 1;

        pageSlider.value =
            0;


        document.getElementById(
            "lastPage"
        ).textContent =
            totalPages;


        /*
           Construimos todas las páginas.
        */

        const pages =
            await createPages();


        setLoading(
            "Construyendo la revista..."
        );


        /*
           Creamos StPageFlip.
        */

        createFlipbook(
            pages
        );


        /*
           Ocultamos loading.
        */

        setTimeout(
            function() {

                hideLoading();

                updateZoom();

            },
            500
        );


    } catch (
        error
    ) {

        console.error(
            "Error real:",
            error
        );


        showError(
            `
            <strong>
                No se pudo inicializar la revista.
            </strong>

            <br><br>

            El PDF fue encontrado, pero ocurrió
            un error al construir el Flipbook.

            <br><br>

            <small>
                ${error.message || error}
            </small>
            `
        );
    }
}


/* =========================================================
   INICIAR
   ========================================================= */

start();

</script>

</body>

</html>
